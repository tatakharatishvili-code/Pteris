<section class="hero">
  <!-- Video Background -->
  <div class="hero__bg">
    <video class="hero__bg-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="/assets/video/hero.mp4" type="video/mp4" />
    </video>
    <div class="hero__bg-overlay"></div>
    <div class="hero__bg-pattern"></div>
    <div class="hero__bg-orb hero__bg-orb--1"></div>
    <div class="hero__bg-orb hero__bg-orb--2"></div>
  </div>

  <div class="hero__container">
    <div class="hero__content">
      <!-- Badge -->
      <div class="hero__badge">
        <span class="hero__badge-dot"></span>
        <span>{{ slides[currentSlide()].badge }}</span>
      </div>

      <!-- Slide Content -->
      <div class="hero__text">
        @for (slide of slides; track $index) {
          <div class="hero__slide" [class.active]="currentSlide() === $index">
            <h1 class="hero__title">
              <span class="hero__title-line">{{ slide.title }}</span>
              <span class="hero__title-accent">{{ slide.subtitle }}</span>
            </h1>
            <p class="hero__description">{{ slide.description }}</p>
          </div>
        }
      </div>

      <!-- CTAs -->
      <div class="hero__actions">
        <a href="#products" class="hero__btn hero__btn--primary">
          <span>პროდუქტების ნახვა</span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#services" class="hero__btn hero__btn--secondary">
          <span>სერვისები</span>
        </a>
      </div>

      <!-- Slide Indicators -->
      <div class="hero__indicators">
        @for (slide of slides; track $index) {
          <button
            class="hero__indicator"
            [class.active]="currentSlide() === $index"
            (click)="goToSlide($index)"
            [attr.aria-label]="'სლაიდი ' + ($index + 1)"
          >
            <span class="hero__indicator-fill"></span>
          </button>
        }
      </div>
    </div>

  </div>

  <!-- Bottom scroll indicator -->
  <button class="hero__scroll" (click)="scrollToContent()" aria-label="ჩასქროლე">
    <span class="hero__scroll-text">ჩასქროლე</span>
    <div class="hero__scroll-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 4V16M10 16L5 11M10 16L15 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="hero__scroll-line"></div>
  </button>
</section>
