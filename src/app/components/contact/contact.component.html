<section class="contact" id="contact">
  <div class="contact__container">
    <div class="contact__header">
      <span class="contact__label">კონტაქტი</span>
      <h2 class="contact__title">
        მოგვწერეთ
        <span class="contact__title-accent">ან დაგვირეკეთ</span>
      </h2>
      <p class="contact__subtitle">
        გაქვთ კითხვა ან გსურთ კონსულტაცია? დაგვიკავშირდით ნებისმიერი ხერხით.
      </p>
    </div>

    <div class="contact__grid">
      <!-- Form -->
      <div class="contact__form-wrapper">
        <form class="contact__form" (submit)="$event.preventDefault()">
          <div class="contact__form-row">
            <div class="contact__form-group">
              <label>სახელი</label>
              <input type="text" placeholder="თქვენი სახელი">
            </div>
            <div class="contact__form-group">
              <label>ელ-ფოსტა</label>
              <input type="email" placeholder="email@example.com">
            </div>
          </div>
          <div class="contact__form-group">
            <label>ტელეფონი</label>
            <input type="tel" placeholder="+995 5XX XXX XXX">
          </div>
          <div class="contact__form-group">
            <label>სერვისი</label>
            <select>
              <option value="">აირჩიეთ სერვისი</option>
              <option>ლანდშაფტის დიზაინი</option>
              <option>ინტერიერის გამწვანება</option>
              <option>მცენარეთა მოვლა</option>
              <option>ღონისძიების გაფორმება</option>
              <option>კონსულტაცია</option>
              <option>სხვა</option>
            </select>
          </div>
          <div class="contact__form-group">
            <label>შეტყობინება</label>
            <textarea rows="5" placeholder="მოგვწერეთ თქვენი სურვილი..."></textarea>
          </div>
          <button type="submit" class="contact__form-btn">
            <span>გაგზავნა</span>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Info -->
      <div class="contact__info">
        <div class="contact__info-cards">
          @for (info of contactInfo; track info.label) {
            <div class="contact__info-card">
              <div class="contact__info-icon">
                @switch (info.icon) {
                  @case ('location') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10C21 17 12 23 12 23C12 23 3 17 3 10C3 7.61305 3.94821 5.32387 5.63604 3.63604C7.32387 1.94821 9.61305 1 12 1C14.3869 1 16.6761 1.94821 18.364 3.63604C20.0518 5.32387 21 7.61305 21 10Z"/><circle cx="12" cy="10" r="3"/></svg>
                  }
                  @case ('phone') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92V19.92C22 20.4835 21.7766 21.0241 21.3764 21.4246C20.9762 21.8252 20.4358 22.049 19.8722 22.0497C16.5707 21.7375 13.3923 20.6338 10.59 18.8303C7.98542 17.1825 5.78849 14.9856 4.1407 12.381C2.33 9.56805 1.22625 6.37733 0.920036 3.0645C0.914985 2.50223 1.13731 1.96285 1.5357 1.56265C1.93409 1.16244 2.47325 0.937335 3.0355 0.935057H6.0355C7.03154 0.924814 7.86922 1.63375 8.0155 2.6195C8.14655 3.5907 8.39355 4.54365 8.7505 5.45898C9.02442 6.13045 8.85012 6.8943 8.3055 7.38098L7.0455 8.64098C8.56891 11.3429 10.749 13.5231 13.451 15.0466L14.711 13.7866C15.1977 13.242 15.9616 13.0677 16.633 13.3416C17.5483 13.6985 18.5013 13.9455 19.4725 14.0766C20.4694 14.2242 21.1838 15.0765 21.162 16.0835L22 16.92Z"/></svg>
                  }
                  @case ('email') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z"/><path d="M22 6L12 13L2 6"/></svg>
                  }
                  @case ('hours') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6V12L16 14"/></svg>
                  }
                }
              </div>
              <div>
                <span class="contact__info-label">{{ info.label }}</span>
                <span class="contact__info-value">{{ info.value }}</span>
              </div>
            </div>
          }
        </div>

        <!-- Map Placeholder -->
        <div class="contact__map">
          <div class="contact__map-inner">
            <svg viewBox="0 0 400 200" fill="none">
              <rect width="400" height="200" rx="16" fill="#EDF2EE"/>
              <circle cx="200" cy="90" r="8" fill="#52B788" opacity="0.8"/>
              <circle cx="200" cy="90" r="20" fill="#52B788" opacity="0.15"/>
              <circle cx="200" cy="90" r="35" fill="#52B788" opacity="0.08"/>
              <text x="200" y="140" text-anchor="middle" fill="#2D6A4F" font-size="12" font-weight="500">თბილისი, საქართველო</text>
              <text x="200" y="160" text-anchor="middle" fill="#95D5B2" font-size="10">41.7151° N, 44.8271° E</text>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
