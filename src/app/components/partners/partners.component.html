<section class="partners" id="partners">
  <div class="partners__container">
    <div class="partners__header">
      <span class="partners__label">პარტნიორები</span>
      <h2 class="partners__title">
        ნდობით გვირჩევენ
        <span class="partners__title-accent">წამყვანი ბრენდები</span>
      </h2>
    </div>

    <!-- Partners Marquee -->
    <div class="partners__marquee">
      <div class="partners__marquee-track">
        @for (partner of partners; track partner.name) {
          <div class="partners__partner">
            <span class="partners__partner-name">{{ partner.name }}</span>
            <span class="partners__partner-type">{{ partner.type }}</span>
          </div>
        }
        <!-- Duplicate for seamless loop -->
        @for (partner of partners; track partner.name + '-dup') {
          <div class="partners__partner">
            <span class="partners__partner-name">{{ partner.name }}</span>
            <span class="partners__partner-type">{{ partner.type }}</span>
          </div>
        }
      </div>
    </div>

    <div class="partners__footer">
      <a routerLink="/partners" class="partners__more">ყველა პარტნიორი <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
