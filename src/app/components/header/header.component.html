<header class="header" [class.scrolled]="isScrolled()">
  <div class="header__inner">
    <!-- Logo -->
    <a href="#" class="header__logo" routerLink="/" (click)="closeMobileMenu()">
      <div class="header__logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          <path d="M20 8 C20 8, 12 16, 12 24 C12 28.4 15.6 32 20 32 C24.4 32 28 28.4 28 24 C28 16 20 8 20 8Z" fill="currentColor" opacity="0.2"/>
          <path d="M20 12 C20 12, 15 18, 15 23 C15 25.8 17.2 28 20 28 C22.8 28 25 25.8 25 23 C25 18 20 12 20 12Z" fill="currentColor" opacity="0.5"/>
          <path d="M20 16 C20 16, 17.5 20, 17.5 23 C17.5 24.4 18.6 25.5 20 25.5 C21.4 25.5 22.5 24.4 22.5 23 C22.5 20 20 16 20 16Z" fill="currentColor"/>
        </svg>
      </div>
      <span class="header__logo-text">
        <span class="header__logo-name">PTERIS</span>
        <span class="header__logo-tagline">მცენარეები & სერვისები</span>
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="header__nav">
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a
            class="header__nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ item.label }}
          </a>
        } @else {
          <a
            class="header__nav-link"
            [href]="item.anchor"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <!-- CTA Button -->
    <a href="/contact" class="header__cta">
      <span>დაგვიკავშირდით</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="header__burger"
      [class.active]="isMobileMenuOpen()"
      (click)="toggleMobileMenu()"
      aria-label="მენიუ"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="header__mobile" [class.open]="isMobileMenuOpen()">
    <nav class="header__mobile-nav">
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a
            class="header__mobile-link"
            [routerLink]="item.route"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        } @else {
          <a
            class="header__mobile-link"
            [href]="item.anchor"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }
      }
      <a href="/contact" class="header__mobile-cta" (click)="closeMobileMenu()">
        დაგვიკავშირდით
      </a>
    </nav>
  </div>
</header>
