<div class="dashboard">
  <div class="dashboard-header">
    <div>
      <h1 class="page-title">დეშბორდი</h1>
      <p class="page-subtitle">მოგესალმებით, {{ authService.user()?.email }}</p>
    </div>
  </div>

  <div class="stats-grid">
    <a class="stat-card" routerLink="/admin/products">
      <div class="stat-info">
        <span class="stat-label">პროდუქტები</span>
        <span class="stat-value">{{ loading() ? '—' : counts().products }}</span>
      </div>
      <span class="stat-arrow">→</span>
    </a>
    <a class="stat-card" routerLink="/admin/lessons">
      <div class="stat-info">
        <span class="stat-label">მოვლის გაკვეთილები</span>
        <span class="stat-value">{{ loading() ? '—' : counts().lessons }}</span>
      </div>
      <span class="stat-arrow">→</span>
    </a>
    <a class="stat-card" routerLink="/admin/coworkers"><div class="stat-info"><span class="stat-label">გუნდი</span><span class="stat-value">{{ loading() ? '—' : counts().coworkers }}</span></div><span class="stat-arrow">→</span></a>
    <a class="stat-card" routerLink="/admin/messages"><div class="stat-info"><span class="stat-label">შეტყობინებები</span><span class="stat-value">{{ loading() ? '—' : counts().messages }}</span></div><span class="stat-arrow">→</span></a>
  </div>
</div>
