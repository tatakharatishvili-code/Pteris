<div class="login-page">
  <!-- Decorative background -->
  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="login-card">
    <!-- Logo / Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <path d="M20 4C14 4 8 10 8 18c0 6 4 12 12 18 8-6 12-12 12-18 0-8-6-14-12-14z"
                fill="var(--color-green-vibrant)" opacity="0.3"/>
          <path d="M20 8c-4.5 0-8 4.5-8 10 0 4.5 3 9 8 13 5-4 8-8.5 8-13 0-5.5-3.5-10-8-10z"
                fill="var(--color-forest)"/>
          <circle cx="20" cy="17" r="3" fill="var(--color-gold)"/>
        </svg>
      </div>
      <h1 class="brand-name">Pteris</h1>
      <p class="brand-sub">ადმინ პანელი</p>
    </div>

    <!-- Login Form -->
    <form class="login-form" (ngSubmit)="onSubmit()">
      @if (error()) {
        <div class="error-message">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 4.5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="field">
        <label for="email">ელფოსტა</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="4" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M2 6l7 4 7-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@pteris.ge"
            autocomplete="email"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="field">
        <label for="password">პაროლი</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="4" y="8" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6 8V6a3 3 0 116 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="9" cy="12" r="1" fill="currentColor"/>
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="loading()"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'პაროლის დამალვა' : 'პაროლის ჩვენება'"
          >
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M2 9s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.4"/>
                <path d="M3 15L15 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M2 9s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          <span>შესვლა...</span>
        } @else {
          <span>შესვლა</span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        მთავარ გვერდზე დაბრუნება
      </a>
    </div>
  </div>
</div>
