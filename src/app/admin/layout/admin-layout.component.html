<div class="admin-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <path d="M20 8c-4.5 0-8 4.5-8 10 0 4.5 3 9 8 13 5-4 8-8.5 8-13 0-5.5-3.5-10-8-10z"
                fill="var(--color-gold)"/>
          <circle cx="20" cy="17" r="3" fill="var(--color-forest)"/>
        </svg>
      </div>
      <div>
        <span class="brand-title">Pteris</span>
        <span class="brand-label">Admin</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>დეშბორდი</span>
      </a>

      <a routerLink="/admin/services" routerLinkActive="active" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6 8h8M6 11h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>სერვისები</span>
      </a>

      <a routerLink="/admin/results" routerLinkActive="active" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="3" width="14" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="14" width="6" height="3" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="14" width="6" height="3" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 11v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>შედეგები</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="user-email">{{ authService.user()?.email }}</span>
      </div>
      <button class="btn-logout" (click)="onLogout()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M7 3H4a1 1 0 00-1 1v10a1 1 0 001 1h3M12 12l3-3-3-3M7 9h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>გასვლა</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <router-outlet />
  </main>
</div>
