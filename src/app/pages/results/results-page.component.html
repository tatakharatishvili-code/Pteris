<!-- Page Hero -->
<app-page-hero label="შედეგები" title="ჩვენი" titleAccent="წარმატებული პროექტები"
    subtitle="ყოველი პროექტი უნიკალური ისტორიაა. ნახეთ, როგორ ვქმნით მწვანე სივრცეებს საქართველოს წამყვან ლოკაციებზე." />

<!-- Projects Grid -->
<section class="results-page">
    <div class="results-page__container">
        <div class="results-page__grid">
            @for (project of projects; track project.slug) {
            <div class="results-page__card">
                <!-- Before / After Slider -->
                <div class="results-page__ba" #baSlider (mousemove)="onSliderMove($event, project.slug, baSlider)"
                    (touchmove)="onSliderMove($event, project.slug, baSlider)">
                    <!-- After (full background) -->
                    <div class="results-page__ba-after" [style.background]="project.afterGradient">
                        <span class="results-page__ba-label results-page__ba-label--after">შემდეგ</span>
                    </div>

                    <!-- Before (clipped) -->
                    <div class="results-page__ba-before" [style.background]="project.beforeGradient"
                        [style.clip-path]="'inset(0 ' + (100 - getSliderPosition(project.slug)) + '% 0 0)'">
                        <span class="results-page__ba-label results-page__ba-label--before">მანამდე</span>
                    </div>

                    <!-- Slider Handle -->
                    <div class="results-page__ba-handle" [style.left.%]="getSliderPosition(project.slug)">
                        <div class="results-page__ba-line"></div>
                        <div class="results-page__ba-knob">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M7 4L3 10L7 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M13 4L17 10L13 16" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>

                    <!-- Category Badge -->
                    <span class="results-page__ba-category">{{ project.category }}</span>
                </div>

                <!-- Card Content -->
                <div class="results-page__card-body">
                    <h3 class="results-page__card-title">{{ project.title }}</h3>
                    <p class="results-page__card-desc">{{ project.description }}</p>

                    <div class="results-page__card-stats">
                        <div class="results-page__card-stat">
                            <span class="results-page__card-stat-val">{{ project.stats.plants }}</span>
                            <span class="results-page__card-stat-lbl">მცენარე</span>
                        </div>
                        <div class="results-page__card-stat">
                            <span class="results-page__card-stat-val">{{ project.stats.area }}</span>
                            <span class="results-page__card-stat-lbl">ფართობი</span>
                        </div>
                        <div class="results-page__card-stat">
                            <span class="results-page__card-stat-val">{{ project.stats.duration }}</span>
                            <span class="results-page__card-stat-lbl">ვადა</span>
                        </div>
                    </div>

                    <a [routerLink]="['/results', project.slug]" class="results-page__card-link">
                        <span>დეტალურად</span>
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                            <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                </div>
            </div>
            }
        </div>
    </div>
</section>
